services:
  qpdf:
    build: ./backend
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      MAX_FILE_BYTES: "157286400"
      MAX_PAGES: "800"
      MAX_CONCURRENT: "2"
      JOB_TIMEOUT_MS: "60000"
      TEMP_DIR: "/tmp"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
    cpus: "1.0"
